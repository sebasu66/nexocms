name: Deploy Cloudflare MCP POC

on:
  workflow_dispatch:
  push:
    branches:
      - poc/cloudflare-mcp-core
    paths:
      - "experiments/cloudflare-mcp/**"
      - ".github/workflows/deploy-cloudflare-mcp-poc.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: experiments/cloudflare-mcp
          command: deploy

      - name: Smoke test health endpoint
        if: ${{ steps.deploy.outputs.deployment-url != '' }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 2 "$DEPLOYMENT_URL/health"
