name: Deploy Cloudflare MCP POC

on:
  workflow_dispatch:
  push:
    branches:
      - poc/cloudflare-mcp-core
    paths:
      - "experiments/cloudflare-mcp/**"
      - ".github/workflows/deploy-cloudflare-mcp-poc.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: experiments/cloudflare-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: experiments/cloudflare-mcp
          command: deploy

      - name: Smoke test health endpoint
        if: ${{ steps.deploy.outputs.deployment-url != '' }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 "$DEPLOYMENT_URL/health"

      - name: Smoke test MCP endpoint
        if: ${{ steps.deploy.outputs.deployment-url != '' }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          response="$(curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 \
            --header 'Accept: application/json, text/event-stream' \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            "$DEPLOYMENT_URL/mcp")"
          grep -F '"name":"nexo_status"' <<< "$response"
